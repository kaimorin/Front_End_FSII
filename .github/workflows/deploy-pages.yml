name: Tests y deploy a GitHub Pages

on:
  push:
    branches: [main, migracion-2, migracion-3]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Correr tests e2e (Playwright)'
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests unitarios (Vitest)
        run: npm run test:run

      - name: Instalar navegador de Playwright
        if: ${{ !contains(github.event.head_commit.message, '[skip e2e]') && (github.event_name != 'workflow_dispatch' || inputs.run_e2e) }}
        run: npx playwright install --with-deps chromium

      - name: Tests e2e (Playwright)
        if: ${{ !contains(github.event.head_commit.message, '[skip e2e]') && (github.event_name != 'workflow_dispatch' || inputs.run_e2e) }}
        run: npm run test:e2e

      - name: Subir reporte de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4